<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <style>

/* Reset and Global Styles */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

html {
    width: 100%;
    min-height: 100%;
}

body {
    width: 100%;
    min-height: 100vh;
    min-height: 100svh;

    padding: 20px;

    background:
        url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1650&q=80')
        no-repeat center center / cover;

    background-attachment: fixed;

    display: flex;
    justify-content: center;
    align-items: center;

    color: white;

    overflow-x: hidden;
}


/* Container */
.container {
    width: min(100%, 420px);

    padding: 40px 30px;

    background: rgba(0, 0, 0, 0.5);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    border-radius: 20px;

    box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.25);

    text-align: center;
}


/* Form Toggle */
.form-toggle {
    width: 100%;

    display: flex;

    gap: 12px;

    margin-bottom: 25px;
}

.form-toggle button {
    flex: 1;

    min-height: 44px;

    padding: 10px 15px;

    background-color: #4caf50;

    color: white;

    border: none;

    border-radius: 8px;

    cursor: pointer;

    font-weight: bold;

    font-size: 15px;

    transition:
        background-color 0.3s ease,
        transform 0.2s ease;
}

.form-toggle button:hover {
    background-color: #388e3c;
}

.form-toggle button:active {
    transform: scale(0.98);
}


/* Forms */
form {
    width: 100%;

    display: none;

    flex-direction: column;

    gap: 12px;
}

form.active {
    display: flex;
}

form h2 {
    margin-bottom: 8px;

    font-size: clamp(22px, 5vw, 28px);
}


/* Inputs */
input {
    width: 100%;

    min-height: 46px;

    padding: 12px;

    border: 1px solid transparent;

    border-radius: 6px;

    outline: none;

    font-size: 16px;

    background:
        rgba(255, 255, 255, 0.12);

    color: white;
}

input::placeholder {
    color: #ccc;
}

input:focus {
    border-color: #4caf50;

    background:
        rgba(255, 255, 255, 0.16);
}


/* Password Wrapper */
.password-wrapper {
    width: 100%;

    display: flex;

    align-items: center;

    gap: 6px;
}

.password-wrapper input {
    min-width: 0;

    flex: 1;
}

.toggle-password {
    flex-shrink: 0;

    min-height: 40px;

    padding: 8px 10px;

    background: transparent;

    border: none;

    color: #4caf50;

    font-weight: bold;

    font-size: 14px;

    cursor: pointer;

    border-radius: 4px;
}

.toggle-password:hover {
    background-color:
        rgba(76, 175, 80, 0.15);
}


/* Messages */
.error {
    width: 100%;

    color: #ff6b6b;

    font-size: 14px;

    line-height: 1.4;

    text-align: left;

    overflow-wrap: anywhere;
}

.success {
    width: 100%;

    color: #8bc34a;

    font-size: 14px;

    line-height: 1.4;

    text-align: center;

    overflow-wrap: anywhere;
}


/* Submit Button */
form button[type="submit"] {
    width: 100%;

    min-height: 46px;

    padding: 12px;

    background-color: #4caf50;

    color: white;

    font-weight: bold;

    font-size: 15px;

    border: none;

    border-radius: 8px;

    cursor: pointer;

    transition:
        background-color 0.3s ease,
        opacity 0.3s ease;
}

form button[type="submit"]:hover {
    background-color: #388e3c;
}

form button[type="submit"]:disabled {
    background-color: #777;

    opacity: 0.7;

    cursor: not-allowed;
}


/* Login / Register Link */
.form-link {
    width: 100%;

    margin-top: 5px;

    color: #ddd;

    font-size: 14px;

    line-height: 1.5;

    text-align: center;
}

.form-link button {
    padding: 0;

    background: none;

    border: none;

    color: #4caf50;

    font-weight: bold;

    font-size: inherit;

    cursor: pointer;
}

.form-link button:hover {
    text-decoration: underline;
}


/* Mobile */
@media (max-width: 480px) {

    body {
        padding: 12px;
    }

    .container {
        width: 100%;

        padding: 28px 18px;

        border-radius: 16px;
    }

    .form-toggle {
        gap: 8px;

        margin-bottom: 20px;
    }

    .form-toggle button {
        min-height: 44px;

        padding: 10px 8px;

        font-size: 14px;
    }

    form {
        gap: 10px;
    }

    input {
        min-height: 46px;

        font-size: 16px;
    }

}


/* Very Small Phones */
@media (max-width: 360px) {

    body {
        padding: 8px;
    }

    .container {
        padding: 24px 14px;

        border-radius: 14px;
    }

    .form-toggle {
        gap: 6px;
    }

    .form-toggle button {
        font-size: 13px;
    }

    .toggle-password {
        font-size: 13px;

        padding-left: 5px;
        padding-right: 5px;
    }

    .form-link {
        font-size: 13px;
    }

}


/* Landscape Phones */
@media (
    max-height: 600px
) and (
    orientation: landscape
) {

    body {
        align-items: flex-start;

        padding-top: 20px;
        padding-bottom: 20px;

        overflow-y: auto;
    }

    .container {
        margin-top: 10px;
        margin-bottom: 10px;
    }

}

    </style>

</head>


<body>

<div class="container">

    <!-- Toggle -->
    <div class="form-toggle">

        <button
            type="button"
            id="showLogin"
        >
            Login
        </button>

        <button
            type="button"
            id="showRegister"
        >
            Register
        </button>

    </div>


    <!-- LOGIN -->
    <form
        id="loginForm"
        class="active"
        novalidate
    >

        <h2>Login</h2>

        <div
            class="success"
            id="loginSuccess"
        ></div>

        <input
            type="email"
            id="loginEmail"
            placeholder="Email"
            autocomplete="email"
            required
        >

        <div class="password-wrapper">

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button
                type="button"
                class="toggle-password"
                data-target="loginPassword"
            >
                Show
            </button>

        </div>

        <div
            class="error"
            id="loginError"
        ></div>

        <button type="submit">
            Login
        </button>

        <p class="form-link">

            Don't have an account?

            <button
                type="button"
                id="registerFromLogin"
            >
                Register
            </button>

        </p>

    </form>


    <!-- REGISTER -->
    <form
        id="registerForm"
        novalidate
    >

        <h2>Register</h2>

        <div
            class="success"
            id="registerSuccess"
        ></div>

        <div
            class="error"
            id="registerError"
        ></div>


        <input
            type="text"
            id="fname"
            placeholder="First Name"
            required
        >


        <input
            type="text"
            id="mname"
            placeholder="Middle Name (enter N/A if none)"
            required
        >


        <input
            type="text"
            id="lname"
            placeholder="Last Name"
            required
        >


        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >


        <input
            type="email"
            id="confirmEmail"
            placeholder="Confirm Email"
            required
        >


        <div class="password-wrapper">

            <input
                type="password"
                id="regPassword"
                placeholder="Password"
                required
            >

            <button
                type="button"
                class="toggle-password"
                data-target="regPassword"
            >
                Show
            </button>

        </div>


        <div class="password-wrapper">

            <input
                type="password"
                id="regConfirmPassword"
                placeholder="Confirm Password"
                required
            >

            <button
                type="button"
                class="toggle-password"
                data-target="regConfirmPassword"
            >
                Show
            </button>

        </div>


        <button
            type="submit"
            id="registerButton"
        >
            Register
        </button>


        <p class="form-link">

            Already have an account?

            <button
                type="button"
                id="loginFromRegister"
            >
                Login
            </button>

        </p>

    </form>

</div>


<script>

const loginForm =
    document.getElementById('loginForm');

const registerForm =
    document.getElementById('registerForm');

const showLogin =
    document.getElementById('showLogin');

const showRegister =
    document.getElementById('showRegister');

const registerFromLogin =
    document.getElementById('registerFromLogin');

const loginFromRegister =
    document.getElementById('loginFromRegister');


/* Login Inputs */
const loginEmail =
    document.getElementById('loginEmail');

const loginPassword =
    document.getElementById('loginPassword');

const loginError =
    document.getElementById('loginError');

const loginSuccess =
    document.getElementById('loginSuccess');


/* Register Inputs */
const fname =
    document.getElementById('fname');

const mname =
    document.getElementById('mname');

const lname =
    document.getElementById('lname');

const email =
    document.getElementById('email');

const confirmEmail =
    document.getElementById('confirmEmail');

const regPassword =
    document.getElementById('regPassword');

const regConfirmPassword =
    document.getElementById('regConfirmPassword');

const registerError =
    document.getElementById('registerError');

const registerSuccess =
    document.getElementById('registerSuccess');

const registerButton =
    document.getElementById('registerButton');


/* Regex */
const emailRegex =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

const nameRegex =
    /^[A-Za-z\s]+$/;

const passwordRegex =
    /^(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;


/* Switch to Login */
function openLogin() {

    loginForm.classList.add('active');

    registerForm.classList.remove('active');

    loginError.textContent = '';

    registerError.textContent = '';

    document.title = 'Login';
}


/* Switch to Register */
function openRegister() {

    registerForm.classList.add('active');

    loginForm.classList.remove('active');

    loginError.textContent = '';

    registerError.textContent = '';

    document.title = 'Register';
}


showLogin.addEventListener(
    'click',
    openLogin
);

showRegister.addEventListener(
    'click',
    openRegister
);

registerFromLogin.addEventListener(
    'click',
    openRegister
);

loginFromRegister.addEventListener(
    'click',
    openLogin
);


/* Show / Hide Password */
document
    .querySelectorAll('.toggle-password')
    .forEach(button => {

        button.addEventListener(
            'click',
            () => {

                const input =
                    document.getElementById(
                        button.dataset.target
                    );

                if (!input) {
                    return;
                }

                if (
                    input.type === 'password'
                ) {

                    input.type = 'text';

                    button.textContent = 'Hide';

                } else {

                    input.type = 'password';

                    button.textContent = 'Show';
                }

            }
        );

    });


/* Login Validation */
loginForm.addEventListener(
    'submit',
    event => {

        event.preventDefault();

        loginError.textContent = '';

        loginSuccess.textContent = '';


        const userEmail =
            loginEmail.value.trim();

        const password =
            loginPassword.value;


        if (userEmail === '') {

            loginError.textContent =
                'Email is required.';

            return;
        }


        if (
            !emailRegex.test(userEmail)
        ) {

            loginError.textContent =
                'Invalid email format.';

            return;
        }


        if (password === '') {

            loginError.textContent =
                'Password is required.';

            return;
        }


        loginSuccess.textContent =
            'Login information is valid.';


    }
);


/* Register Validation */
function validateRegister() {

    registerError.textContent = '';

    registerSuccess.textContent = '';


    const firstName =
        fname.value.trim();

    const middleName =
        mname.value.trim();

    const lastName =
        lname.value.trim();

    const userEmail =
        email.value.trim();

    const userConfirmEmail =
        confirmEmail.value.trim();

    const password =
        regPassword.value;

    const confirmPassword =
        regConfirmPassword.value;


    /* First Name */
    if (firstName === '') {

        registerError.textContent =
            'First name is required.';

        return false;
    }


    if (
        firstName.length < 3 ||
        !nameRegex.test(firstName)
    ) {

        registerError.textContent =
            'First name must be at least 3 letters and contain no numbers.';

        return false;
    }


    /* Middle Name */
    if (middleName === '') {

        registerError.textContent =
            'Middle name is required. Enter N/A if you do not have a middle name.';

        return false;
    }


    if (
        middleName.toUpperCase() !== 'N/A' &&
        (
            middleName.length < 3 ||
            !nameRegex.test(middleName)
        )
    ) {

        registerError.textContent =
            'Middle name must be at least 3 letters or N/A if none.';

        return false;
    }


    /* Last Name */
    if (lastName === '') {

        registerError.textContent =
            'Last name is required.';

        return false;
    }


    if (
        lastName.length < 3 ||
        !nameRegex.test(lastName)
    ) {

        registerError.textContent =
            'Last name must be at least 3 letters and contain no numbers.';

        return false;
    }


    /* Email */
    if (userEmail === '') {

        registerError.textContent =
            'Email is required.';

        return false;
    }


    if (
        !emailRegex.test(userEmail)
    ) {

        registerError.textContent =
            'Invalid email format.';

        return false;
    }


    /* Confirm Email */
    if (userConfirmEmail === '') {

        registerError.textContent =
            'Confirm email is required.';

        return false;
    }


    if (
        userEmail !== userConfirmEmail
    ) {

        registerError.textContent =
            'Emails do not match.';

        return false;
    }


    /* Password */
    if (password === '') {

        registerError.textContent =
            'Password is required.';

        return false;
    }


    if (
        !passwordRegex.test(password)
    ) {

        registerError.textContent =
            'Password must be at least 8 characters with 1 uppercase letter, 1 number, and 1 special character.';

        return false;
    }


    /* Confirm Password */
    if (confirmPassword === '') {

        registerError.textContent =
            'Confirm password is required.';

        return false;
    }


    if (
        password !== confirmPassword
    ) {

        registerError.textContent =
            'Passwords do not match.';

        return false;
    }


    return true;
}


/* Register Input Validation */
registerForm.addEventListener(
    'input',
    () => {

        registerError.textContent = '';

        registerSuccess.textContent = '';

    }
);


/* Register Submit */
registerForm.addEventListener(
    'submit',
    event => {

        event.preventDefault();


        if (!validateRegister()) {

            return;
        }


        registerSuccess.textContent =
            'Registration successful! You can now login.';

    }
);

</script>

</body>

</html>
